    background-size: auto, 340px auto;
    border: 1px solid #2a2a30;
    border-radius: 4px;
    width: 100%;
    max-width: 680px;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  }

  .card-header {
    padding: 32px 36px 28px;
    border-bottom: 1px solid #222228;
    position: relative;
  }

  .card-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
  }

  .label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #c9a84c;
    margin-bottom: 10px;
  }

  .date-hebrew {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    font-weight: 600;
    line-height: 1.1;
    color: #e8e4d8;
  }

  .date-russian {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    color: #7a7870;
    margin-top: 8px;
  }

  .card-body {
    padding: 0 36px 32px;
  }

  .section {
    padding: 24px 0;
    border-bottom: 1px solid #222228;
  }

  .section:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #7a6330;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #222228;
  }

  .section-text {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.75;
    color: #e8e4d8;
    white-space: pre-wrap;
  }

  .section-text.tehilim {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 400;
    color: #d4c99a;
    line-height: 1.6;
  }

  .text-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 14px 0;
    color: #c9a84c;
  }
  .text-divider::before,
  .text-divider::after {
    content: '';
    flex: 1;
    max-width: 60px;
    height: 1px;
    background: #3a3730;
  }
  .text-divider span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 0.15em;
  }

  .shabbat-section { border-left: 2px solid #c9a84c; padding-left: 14px; }
  .shabbat-text { font-size: 14px; font-weight: 300; color: #d4c99a; line-height: 1.75; white-space: pre-wrap; }

  .yortsait-list { display: flex; flex-direction: column; gap: 6px; }

  .yortsait-item {
    font-size: 13.5px;
    font-weight: 300;
    color: #e8e4d8;
    line-height: 1.6;
    padding-left: 14px;
    position: relative;
  }

  .yortsait-item::before {
    content: '—';
    position: absolute;
    left: 0;
    color: #7a6330;
  }

  .community-yortsait .section-text {
    color: #c9a84c;
    font-size: 15px;
  }

  .community-yortsait .section-text strong { font-weight: 500; }

  .youtube-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 4px;
  }

  .youtube-wrapper iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .video-note {
    font-size: 12.5px;
    font-style: italic;
    color: #7a7870;
    margin-bottom: 12px;
  }

  .section-text.clamped {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .section-text.clamped.expanded {
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
  }

  .expand-btn {
    margin-top: 12px;
    background: none;
    border: 1px solid #2a2a30;
    color: #c9a84c;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .expand-btn:hover { border-color: #c9a84c; }

  .photo-link-section {
    padding: 20px 36px 4px;
    display: flex;
    justify-content: center;
  }

  .photo-link-btn {
    display: inline-block;
    background: none;
    border: 1px solid #c9a84c;
    color: #c9a84c;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 22px;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }

  .photo-link-btn:hover { background: #c9a84c; color: #17171a; }

  @media (max-width: 480px) {
    .photo-link-section { padding-left: 20px; padding-right: 20px; }
  }

  .zmanim-list { display: flex; flex-direction: column; gap: 6px; }

  .zmanim-item {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 13.5px;
    font-weight: 300;
    line-height: 1.6;
  }

  .zmanim-label { color: #7a7870; }
  .zmanim-value { color: #e8e4d8; font-weight: 400; white-space: nowrap; }

  .card-footer {
    background: #111113;
    border-top: 1px solid #222228;
    padding: 14px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-text { font-size: 11px; color: #7a7870; letter-spacing: 0.04em; }
  .candle { font-size: 16px; opacity: 0.6; }

  .loading {
    color: #7a7870;
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }

  .error {
    color: #c0392b;
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }

  @media (max-width: 500px) {
    .card-header, .card-body { padding-left: 20px; padding-right: 20px; }
    .card-footer { padding-left: 20px; padding-right: 20px; }
    .date-hebrew { font-size: 28px; }
    .page-title { font-size: 22px; }
  }
</style>
</head>
<body style="background-color:#0a1628;">

<div class="page-title">Уважаемые друзья, члены общины «Бейт Шимшон»!</div>

<div class="card" id="card">
  <div class="loading">Загрузка данных...</div>
</div>

<script>
const SPREADSHEET_ID = '1OdL5dt4clO7dwMnTPfArrlmX7TuagNneSY5mKKYfRDo';
const DATA_TAB = 'data_tab';
const ZMANIM_TAB = 'zmanim';
const TANAKH_TAB = 'Tanakh';

// --- data_tab columns ---
const COL_DATE        = 0;
const COL_HEBREW_DATE = 1;
const COL_TEHILIM     = 2;
const COL_GENERAL     = 3;
const COL_YORTSAIT    = 4;
const COL_ADDITIONAL  = 5;  // "Толкование сновидений" (бывшее "Дополнительно")
const COL_COMMUNITY   = 8;
const COL_GENDER      = 9;
const COL_SHABBAT     = 10;
const COL_YOUTUBE     = 11;

// --- zmanim columns ---
// ПРЕДПОЛОЖЕНИЕ: дата в листе zmanim находится в колонке A (индекс 0), как в data_tab.
const ZCOL_DATE            = 0;
const ZCOL_STARS_OUT       = 2;  // C — Выход звёзд
const ZCOL_MIDNIGHT        = 3;  // D — Полночь
const ZCOL_ALOT_HASHACHAR  = 4;  // E — Алот а-Шахар
const ZCOL_MISHEYAKIR      = 5;  // F — мишеякир (талит и тфилин)
const ZCOL_SUNRISE         = 6;  // G — Восход солнца
const ZCOL_SHMA_END        = 7;  // H — Окончание чтения Шма
const ZCOL_AMIDA_END       = 8;  // I — Окончание чтения Амиды
const ZCOL_NOON            = 9;  // J — Полдень
const ZCOL_MINCHA_GDOLA    = 10; // K — Минха Гдола
const ZCOL_ET_RATZON       = 11; // L — Эт Рацон
const ZCOL_MINCHA_KTANA    = 12; // M — Минха Ктана
const ZCOL_MINCHA          = 13; // N — Минха
const ZCOL_SUNSET          = 15; // P — Заход солнца
const ZCOL_HALACHIC_HOUR   = 17; // R — Длина дневного алахического часа

// --- Tanakh columns ---
// ПРЕДПОЛОЖЕНИЕ: дата в листе Tanakh находится в колонке A (индекс 0), как в data_tab.
const TCOL_DATE   = 0;
const TCOL_C      = 2; // C — Танах Йоми, выделенная часть
const TCOL_D      = 3; // D — Танах Йоми, обычный текст
const TCOL_WISDOM = 4; // E — Мудрость дня

function getTodayStr() {
  const now = new Date();
  const d = String(now.getDate()).padStart(2, '0');
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const y = now.getFullYear();
  return `${d}.${m}.${y}`;
}

function normaliseDate(raw) {
  if (!raw) return '';
  if (/^\d{2}\.\d{2}\.\d{4}$/.test(raw)) return raw;
  const gviz = raw.match(/Date\((\d+),(\d+),(\d+)\)/);
  if (gviz) {
    const y = gviz[1];
    const m = String(parseInt(gviz[2]) + 1).padStart(2, '0');
    const d = String(gviz[3]).padStart(2, '0');
    return `${d}.${m}.${y}`;
  }
  const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[3]}.${iso[2]}.${iso[1]}`;
  const short = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (short) return `${short[1].padStart(2,'0')}.${short[2].padStart(2,'0')}.${short[3]}`;
  return raw;
}

function formatDateRussian(dateStr) {
  const months = ['января','февраля','марта','апреля','мая','июня',
                  'июля','августа','сентября','октября','ноября','декабря'];
  const parts = dateStr.split('.');
  if (parts.length !== 3) return dateStr;
  const d = parseInt(parts[0]);
  const m = parseInt(parts[1]) - 1;
  const y = parts[2];
  if (isNaN(d) || isNaN(m)) return dateStr;
  return `${d} ${months[m]} ${y}`;
}

function parseDateToObj(ddmmyyyy) {
  if (!ddmmyyyy) return null;
  const parts = ddmmyyyy.split('.');
  if (parts.length !== 3) return null;
  const d = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10) - 1;
  const y = parseInt(parts[2], 10);
  if (isNaN(d) || isNaN(m) || isNaN(y)) return null;
  return new Date(y, m, d);
}

// row-элементы теперь объекты {v, f}: v — «сырое» значение (используется для дат/сравнений),
// f — значение, отформатированное так же, как оно показано в самой таблице (используем для зманим,
// чтобы время не превращалось в Date(1899,11,30,H,M,S)).
function cell(row, idx) {
  const c = row[idx];
  return c ? (c.v || '').trim() : '';
}

function cellF(row, idx) {
  const c = row[idx];
  if (!c) return '';
  return (c.f || c.v || '').trim();
}

function mapRow(row) {
  return row.c.map(c => {
    if (!c) return { v: '', f: '' };
    const v = (c.v !== null && c.v !== undefined) ? String(c.v) : '';
    const f = (c.f !== null && c.f !== undefined) ? String(c.f) : '';
    return { v, f };
  });
}

async function fetchSheetRows(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const resp = await fetch(url);
  const text = await resp.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/)[1]);
  return json.table.rows;
}

// Извлекает YouTube video ID из ссылки
function getYouTubeId(url) {
  if (!url) return null;
  const patterns = [
    /youtu\.be\/([^?&]+)/,
    /youtube\.com\/watch\?v=([^&]+)/,
    /youtube\.com\/embed\/([^?&]+)/,
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

// Склеивает колонки C и D листа Tanakh построчно парами: строка из C — выделенная (номер стиха/главы),
// следующая за ней строка из D — обычным текстом. Так повторяется для каждой пары строк.
function buildTanakhHTML(cText, dText) {
  if (!cText && !dText) return '';
  const cLines = cText ? cText.split(/\n+/).map(s => s.trim()).filter(Boolean) : [];
  const dLines = dText ? dText.split(/\n+/).map(s => s.trim()).filter(Boolean) : [];
  const len = Math.max(cLines.length, dLines.length, 1);
  const pairs = [];
  for (let i = 0; i < len; i++) {
    const c = cLines[i] || '';
    const d = dLines[i] || '';
    const bits = [];
    if (c) bits.push(`<strong>${c}</strong>`);
    if (d) bits.push(d);
    if (bits.length) pairs.push(bits.join('<br>'));
  }
  return pairs.join('<br><br>');
}

// Заменяет "***" в тексте на красивый декоративный разделитель
function withDividers(text) {
  if (!text) return '';
  const DIVIDER = '<div class="text-divider"><span>✦</span></div>';
  return text.split('***').map(s => s.trim()).join(DIVIDER);
}

function buildZmanimHTML(zRow) {
  if (!zRow) return '';
  const rows = [
    ['Выход звёзд', cellF(zRow, ZCOL_STARS_OUT)],
    ['Полночь', cellF(zRow, ZCOL_MIDNIGHT)],
    ['Алот а-Шахар (утренняя заря)', cellF(zRow, ZCOL_ALOT_HASHACHAR)],
    ['Время надевания талита и тфилин (мишеякир)', cellF(zRow, ZCOL_MISHEYAKIR)],
    ['Восход солнца', cellF(zRow, ZCOL_SUNRISE)],
    ['Окончание чтения Шма', cellF(zRow, ZCOL_SHMA_END)],
    ['Окончание чтения Амиды', cellF(zRow, ZCOL_AMIDA_END)],
    ['Полдень', cellF(zRow, ZCOL_NOON)],
    ['Минха Гдола', cellF(zRow, ZCOL_MINCHA_GDOLA)],
    ['Эт Рацон', cellF(zRow, ZCOL_ET_RATZON)],
    ['Минха Ктана', cellF(zRow, ZCOL_MINCHA_KTANA)],
    ['Минха', cellF(zRow, ZCOL_MINCHA)],
    ['Заход солнца', cellF(zRow, ZCOL_SUNSET)],
    ['Длина дневного алахического часа', cellF(zRow, ZCOL_HALACHIC_HOUR)],
  ];
  return rows
    .filter(([, v]) => v)
    .map(([label, v]) => `<div class="zmanim-item"><span class="zmanim-label">${label}</span><span class="zmanim-value">${v}</span></div>`)
    .join('');
}

function buildCard(row, nearestYortsaits, zmanimRow, tanakhRow) {
  const dateStr    = cell(row, COL_DATE);
  const hebrewDate = cell(row, COL_HEBREW_DATE);
  const tehilim    = cell(row, COL_TEHILIM);
  const general    = cell(row, COL_GENERAL);
  const yortsait   = cell(row, COL_YORTSAIT);
  const additional = cell(row, COL_ADDITIONAL);
  const shabbat    = cell(row, COL_SHABBAT);
  const community  = cell(row, COL_COMMUNITY);
  const gender     = cell(row, COL_GENDER).toLowerCase();
  const youtube    = cell(row, COL_YOUTUBE);

  // Йорцайт членов общины (сегодня)
  let communityPhrase = '';
  if (community) {
    const soul = (gender === 'ж') ? 'да упокоится душа её в Ган Эдене' : 'да упокоится душа его в Ган Эдене';
    communityPhrase = `Сегодня йорцайт у членов нашей общины: <strong>${community}</strong>, ${soul}`;
  }

  // Йорцайт праведников
  let yortsaitHTML = '';
  if (yortsait) {
    const cleaned = yortsait
      .replace(/\*\*Сегодня йорцайт:\*\*/gi, '')
      .replace(/__Сегодня йорцайт:__/gi, '')
      .replace(/Сегодня йорцайт:/gi, '')
      .trim();
    const items = cleaned
      .split(/\.\s*(?=Рав\s)/)
      .map(s => s.trim())
      .filter(s => s.length > 2);
    yortsaitHTML = items.map(i => `<div class="yortsait-item">${i}</div>`).join('');
  }

  // Ближайшие йорцайты членов общины (будущие даты)
  let nearestHTML = '';
  if (nearestYortsaits && nearestYortsaits.length) {
    nearestHTML = nearestYortsaits.map(r => {
      const soul = (r.gender === 'ж') ? 'да упокоится душа её в Ган Эдене' : 'да упокоится душа его в Ган Эдене';
      return `<div class="yortsait-item">${formatDateRussian(r.dateStr)} — <strong>${r.name}</strong>, ${soul}</div>`;
    }).join('');
  }

  // YouTube embed
  const ytId = getYouTubeId(youtube);
  const ytHTML = ytId ? `
    <div class="youtube-wrapper">
      <iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe>
    </div>` : '';

  // Зманим Саратов
  const zmanimHTML = buildZmanimHTML(zmanimRow);

  // Мудрость дня / Танах Йоми
  const wisdom  = tanakhRow ? cell(tanakhRow, TCOL_WISDOM) : '';
  const tanakhC = tanakhRow ? cell(tanakhRow, TCOL_C) : '';
  const tanakhD = tanakhRow ? cell(tanakhRow, TCOL_D) : '';

  let html = `
    <div class="card-header">
      <div class="label">Еврейский календарь</div>
      <div class="date-hebrew">${hebrewDate || dateStr}</div>
      <div class="date-russian">${formatDateRussian(normaliseDate(dateStr))}</div>
    </div>
    <div class="card-body">
  `;

  // Шаббат
  if (shabbat) {
    html += `
      <div class="section shabbat-section">
        <div class="section-label"><span>✡️</span> Шаббат</div>
        <div class="section-text shabbat-text">${shabbat}</div>
      </div>`;
  }

  // Йорцайт членов общины (сегодня)
  if (communityPhrase) {
    html += `
      <div class="section community-yortsait">
        <div class="section-label"><span>🕍</span> Йорцайт членов общины</div>
        <div class="section-text">${communityPhrase}</div>
      </div>`;
  }

  // Теилим
  if (tehilim) {
    html += `
      <div class="section">
        <div class="section-label"><span>📖</span> Теилим</div>
        <div class="section-text tehilim">${tehilim}</div>
      </div>`;
  }

  // Общее
  if (general) {
    html += `
      <div class="section">
        <div class="section-label"><span>📜</span> Общее</div>
        <div class="section-text">${withDividers(general)}</div>
      </div>`;
  }

  // Ближайшие йорцайты членов общины (перед Йорцайт праведников)
  if (nearestHTML) {
    html += `
      <div class="section">
        <div class="section-label"><span>🕯</span> Ближайшие йорцайты членов общины</div>
        <div class="yortsait-list">${nearestHTML}</div>
      </div>`;
  }

  // Йорцайт праведников
  if (yortsaitHTML) {
    html += `
      <div class="section">
        <div class="section-label"><span>🕯</span> Йорцайт праведников</div>
        <div class="yortsait-list">${yortsaitHTML}</div>
      </div>`;
  }

  // Видео (между Йорцайт праведников и Толкование сновидений)
  if (ytHTML) {
    html += `
      <div class="section">
        <div class="section-label"><span>▶️</span> Видео</div>
        <div class="video-note">Видео доступно к просмотру при включенном VPN</div>
        ${ytHTML}
      </div>`;
  }

  // Толкование сновидений (бывшее "Дополнительно")
  if (additional) {
    html += `
      <div class="section">
        <div class="section-label"><span>✨</span> Толкование сновидений</div>
        <div class="section-text">${additional}</div>
      </div>`;
  }

  // Зманим Саратов
  if (zmanimHTML) {
    html += `
      <div class="section">
        <div class="section-label"><span>⏳</span> Зманим Саратов</div>
        <div class="zmanim-list">${zmanimHTML}</div>
      </div>`;
  }

  // Мудрость дня
  if (wisdom) {
    html += `
      <div class="section">
        <div class="section-label"><span>💡</span> Мудрость дня</div>
        <div class="section-text">${wisdom}</div>
      </div>`;
  }

  // Ежедневное изучение ТаНаХа — Танах Йоми
  if (tanakhC || tanakhD) {
    const tanakhBody = buildTanakhHTML(tanakhC, tanakhD);
    html += `
      <div class="section">
        <div class="section-label"><span>📚</span> Ежедневное изучение ТаНаХа — Танах Йоми</div>
        <div class="section-text clamped" id="tanakh-content">${tanakhBody}</div>
        <button class="expand-btn" id="tanakh-toggle" onclick="toggleTanakh()">Развернуть</button>
      </div>`;
  }

  html += `
    </div>
    <div class="photo-link-section">
      <a class="photo-link-btn" href="photos.html">Фото нашей общины</a>
    </div>
    <div class="card-footer">
      <span class="footer-text">Теилим, сгулот и йорцайты</span>
      <span class="candle">🕯</span>
    </div>
  `;

  return html;
}

function toggleTanakh() {
  const el = document.getElementById('tanakh-content');
  const btn = document.getElementById('tanakh-toggle');
  if (!el || !btn) return;
  const expanded = el.classList.toggle('expanded');
  btn.textContent = expanded ? 'Свернуть' : 'Развернуть';
}

async function loadData() {
  const card = document.getElementById('card');
  const today = getTodayStr();
  const todayObj = parseDateToObj(today);

  try {
    const dataRows = await fetchSheetRows(DATA_TAB);

    let found = null;
    const allCells = [];
    for (const row of dataRows) {
      const cells = mapRow(row);
      allCells.push(cells);
      if (normaliseDate(cell(cells, COL_DATE)) === today) {
        found = cells;
      }
    }

    if (!found) {
      card.innerHTML = `<div class="error">Данные на сегодня (${today}) не найдены в таблице.</div>`;
      return;
    }

    // Ближайшие в будущем йорцайты членов общины (из колонки I)
    const nearest = allCells
      .map(cells => {
        const dateStr = normaliseDate(cell(cells, COL_DATE));
        return {
          dateStr,
          name: cell(cells, COL_COMMUNITY),
          gender: cell(cells, COL_GENDER).toLowerCase(),
          dateObj: parseDateToObj(dateStr)
        };
      })
      .filter(r => r.name && r.dateObj && todayObj && r.dateObj > todayObj)
      .sort((a, b) => a.dateObj - b.dateObj)
      .slice(0, 3);

    // Зманим на сегодня
    let zmanimRow = null;
    try {
      const zRows = await fetchSheetRows(ZMANIM_TAB);
      for (const row of zRows) {
        const cells = mapRow(row);
        if (normaliseDate(cell(cells, ZCOL_DATE)) === today) {
          zmanimRow = cells;
          break;
        }
      }
    } catch (e) {
      // Лист zmanim необязателен — при ошибке просто не показываем раздел
    }

    // Мудрость дня / Танах Йоми на сегодня
    let tanakhRow = null;
    try {
      const tRows = await fetchSheetRows(TANAKH_TAB);
      for (const row of tRows) {
        const cells = mapRow(row);
        if (normaliseDate(cell(cells, TCOL_DATE)) === today) {
          tanakhRow = cells;
          break;
        }
      }
    } catch (e) {
      // Лист Tanakh необязателен — при ошибке просто не показываем разделы
    }

    card.innerHTML = buildCard(found, nearest, zmanimRow, tanakhRow);

    requestAnimationFrame(() => {
      const el = document.getElementById('tanakh-content');
      const btn = document.getElementById('tanakh-toggle');
      if (el && btn && el.scrollHeight <= el.clientHeight + 2) {
        btn.style.display = 'none';
      }
    });

  } catch (e) {
    card.innerHTML = `<div class="error">Ошибка загрузки данных: ${e.message}</div>`;
  }
}

loadData();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/beit-shimshon/sw.js');
}
</script>
